<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7eee4"><title>Adjectives · ELI English</title><link rel="icon" href="adjectives-icon.png?v=1">
<style>
:root{--bg:#f7eee4;--paper:#fffaf4;--soft:#ead7c3;--accent:#825634;--ink:#3a2918;--muted:#765d49;--line:#d4bea0;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 500px at 10% -10%,var(--paper),transparent 60%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}button,a{-webkit-tap-highlight-color:transparent}
button,.btn{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:10px 15px;background:var(--paper);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 var(--line),0 9px 16px #3a291814;transition:transform .08s ease,box-shadow .08s ease;margin-bottom:5px;-webkit-user-select:none;user-select:none;color:var(--ink)}
button:active,.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--line),inset 0 3px 6px #00000026}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.primary,button.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 5px 0 var(--ink),0 9px 16px #3a291826}
.wrap{max-width:1000px;margin:auto;padding:16px 16px 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.topbar .btn,.topbar button{padding:9px 14px;font-size:14px;font-weight:700;white-space:nowrap}
.ver{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 11px;background:var(--paper)}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--muted)}
h1{font:600 clamp(42px,9vw,70px)/1.05 Georgia,serif;letter-spacing:-1.5px;margin:4px 0 8px}
h2{font:600 clamp(26px,6vw,36px)/1.15 Georgia,serif;margin:4px 0 6px}
.hero{display:flex;align-items:center;gap:18px;padding:14px 0 6px}
.hero img{width:104px;height:104px;filter:drop-shadow(0 12px 14px #3a291830);animation:float 5s ease-in-out infinite;flex-shrink:0}
@keyframes float{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.subtitle{color:var(--muted);margin:0}
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}.metric{border:1px solid var(--line);border-radius:30px;padding:5px 13px;font-size:13px;font-weight:600;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:0 8px 0 var(--line),0 18px 40px #3a29181a}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{flex-direction:column;text-align:center;gap:4px;padding:18px 10px;border-radius:22px;background:linear-gradient(180deg,var(--paper),var(--bg));min-height:150px}
.tile .ico{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--soft);font-size:31px;box-shadow:inset 0 -3px 0 #0000001a,0 2px 0 #fff;margin-bottom:6px}
.tile .ico img{width:62px;height:62px}
.tile b{font-size:17px;line-height:1.2}.tile small{font-size:12.5px;color:var(--muted);line-height:1.3}
.tile.big{grid-column:1/-1;flex-direction:row;justify-content:flex-start;text-align:left;gap:16px;min-height:0;padding:16px 18px}
.tile.big .ico{margin:0;flex-shrink:0}.tile.big b{font-size:20px}
.tile.big.es{background:linear-gradient(135deg,#fff3d9,var(--paper))}.tile.big.en{background:linear-gradient(135deg,#e6eef7,var(--paper))}
.tile .txt{display:flex;flex-direction:column;gap:3px}
.screen-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.screen-head .emoji{font-size:34px}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox .s-ico{position:absolute;left:15px;font-size:20px;pointer-events:none}
.searchbox input{width:100%;font-size:19px;padding:16px 50px 16px 48px;border:2px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:inset 0 3px 7px #3a291818;-webkit-appearance:none;appearance:none}
.searchbox input:focus{border-color:var(--accent);outline:none;box-shadow:inset 0 3px 7px #3a291818,0 0 0 4px var(--soft)}
.searchbox input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:8px;width:36px;height:36px;padding:0;border-radius:50%;margin:0;box-shadow:0 3px 0 var(--line)}
.go{width:100%;margin-top:12px;font-size:19px;font-weight:800;padding:15px;border-radius:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}.chips>span{font-size:12px;color:var(--muted);font-weight:700}
.chips button{padding:6px 13px;border-radius:30px;font-size:14px;box-shadow:0 3px 0 var(--line);margin-bottom:3px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}.pills button{border-radius:30px;padding:8px 14px;font-size:14px;font-weight:700}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:600;margin-top:10px}.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s;box-shadow:inset 0 2px 4px #0002}
.track::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.switch input:checked+.track{background:var(--accent)}.switch input:checked+.track::after{transform:translateX(20px)}
.summary{margin:18px 0 12px;padding:12px 14px;border-radius:18px;background:var(--bg);border:1px dashed var(--accent);font:600 18px Georgia,serif}
.summary small{display:block;font:13px system-ui,sans-serif;color:var(--muted);margin-top:3px}
.fam-block{margin:22px 0 8px}.fam-title{display:flex;align-items:center;gap:10px;margin:0 0 10px;font:600 20px Georgia,serif}.fam-title .tag{font:800 11px system-ui;letter-spacing:1.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line),0 12px 24px #3a291812;position:relative}
.card.match{border:2px solid var(--accent);box-shadow:0 6px 0 var(--accent),0 12px 24px #3a29181e}
.card.match::before{content:'✦ Tu búsqueda';position:absolute;top:-11px;left:16px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:2px 10px;border-radius:20px}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.word{font:600 27px/1.15 Georgia,serif;margin:0;overflow-wrap:anywhere}
.lvl{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;margin-top:6px;background:var(--soft)}
.lvl.c1{background:#f3e2b8;color:#6b4a0c}
.say{width:50px;height:50px;padding:0;border-radius:50%;font-size:21px;flex-shrink:0}
.es{font-size:16px;margin:10px 0 12px;color:var(--ink);font-weight:600}
.ex{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:10px 10px 10px 13px;margin:8px 0}
.ex p{margin:0;flex:1;font:16px/1.5 Georgia,serif}.ex-es{display:block;font:italic 14px/1.45 system-ui,sans-serif;color:var(--muted);margin-top:5px}.ex mark{background:var(--soft);color:var(--ink);border-radius:4px;padding:0 3px;font-weight:700}
.ex button{width:40px;height:40px;padding:0;border-radius:50%;font-size:16px;flex-shrink:0;box-shadow:0 3px 0 var(--line);margin-bottom:3px}
.card-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.card-foot button{font-size:13px;padding:7px 12px;border-radius:12px}
.card-foot .fam-link{margin-left:auto;background:none;border:0;box-shadow:none;color:var(--accent);font-weight:700;padding:4px}
.hidden-val{font-style:italic;font-size:15px}
.fam-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fam-tile{flex-direction:column;gap:3px;padding:14px 8px;border-radius:20px;min-height:118px;text-align:center}
.fam-tile .e{font-size:30px}.fam-tile b{font-size:15px;letter-spacing:.5px}.fam-tile small{font-size:12px;color:var(--muted);line-height:1.25}
.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}
.practice{text-align:center}.practice .q{font:600 34px/1.2 Georgia,serif;margin:20px 0 6px}.practice progress{width:100%;height:8px;accent-color:var(--accent)}
.practice .answer{text-align:left;margin-top:14px}.practice .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.practice .actions button{font-size:16px;padding:12px 18px;font-weight:700}
dialog{border:1px solid var(--line);border-radius:26px;padding:0;background:var(--paper);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:90dvh;box-shadow:0 25px 100px #20170d55}
dialog::backdrop{background:#21170e80;backdrop-filter:blur(5px)}
.dlg-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.dlg-body{padding:18px 20px 22px}.dlg-body label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;margin-bottom:14px}
.dlg-body select{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:15px;box-shadow:0 3px 0 var(--line)}
.note{font-size:12.5px;color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 20px;z-index:20;max-width:90vw;font-size:14px}
[hidden]{display:none!important}
.practice .card-foot{display:none}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile.big{grid-column:span 3}.fam-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero img{width:130px;height:130px}}
@media(max-width:420px){.hero{gap:13px}.hero img{width:84px;height:84px}h1{font-size:44px}.tile{min-height:138px;padding:15px 8px}.tile b{font-size:15.5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>

<script>
'use strict';
const DATA={"families":[{"key":"HAPPY","title":"Alegría y satisfacción"},{"key":"SAD","title":"Tristeza y desánimo"},{"key":"ANGRY","title":"Enfado e indignación"},{"key":"AFRAID","title":"Miedo y preocupación"},{"key":"SURPRISED","title":"Sorpresa y desconcierto"},{"key":"GOOD","title":"Calidad y excelencia"},{"key":"BAD","title":"Mala calidad y valoración negativa"},{"key":"TIRED","title":"Cansancio"},{"key":"INTERESTING","title":"Interés y fascinación"},{"key":"BORING","title":"Aburrimiento"},{"key":"DIFFICULT","title":"Dificultad y complejidad"},{"key":"EASY","title":"Facilidad y sencillez"},{"key":"BEAUTIFUL","title":"Belleza y atractivo"},{"key":"BIG","title":"Tamaño y magnitud"},{"key":"SMALL","title":"Tamaño y cantidad reducida"},{"key":"KIND","title":"Amabilidad y empatía"},{"key":"CLEVER","title":"Inteligencia y capacidad"},{"key":"IMPORTANT","title":"Importancia y necesidad"},{"key":"CONFIDENT","title":"Seguridad y determinación"},{"key":"CALM","title":"Tranquilidad y autocontrol"},{"key":"HONEST","title":"Sinceridad y fiabilidad"},{"key":"RUDE","title":"Mala educación y arrogancia"},{"key":"UNCERTAIN","title":"Incertidumbre y ambigüedad"},{"key":"UNFAIR","title":"Injusticia y desigualdad"},{"key":"RELIABLE EVIDENCE","title":"Solidez y validez"},{"key":"FLEXIBLE","title":"Adaptación y apertura"},{"key":"STRICT","title":"Rigidez y exigencia"},{"key":"WEAK","title":"Fragilidad y vulnerabilidad"},{"key":"NEGATIVE ATTITUDE","title":"Escepticismo y desaprobación"},{"key":"VISIBLE","title":"Visibilidad y notoriedad"},{"key":"HARMFUL","title":"Daño y consecuencias negativas"},{"key":"TEMPORARY","title":"Duración y cambios en el tiempo"}],"adjectives":[{"w":"happy","a":0,"es":"feliz, contento","e":["I'm happy with my new timetable.","The children looked happy playing in the snow."],"f":0,"t":["Estoy contenta con mi nuevo horario.","Los niños parecían felices jugando en la nieve."]},{"w":"pleased","a":0,"es":"satisfecho, contento","e":["We're pleased with the test results.","She was pleased to hear from an old friend."],"f":0,"t":["Estamos satisfechos con los resultados del examen.","Se alegró de tener noticias de una vieja amiga."]},{"w":"delighted","a":0,"es":"encantado","e":["I'd be delighted to attend your wedding.","The museum was delighted by the public response."],"f":0,"t":["Estaría encantada de asistir a tu boda.","El museo estaba encantado con la respuesta del público."]},{"w":"thrilled","a":0,"es":"entusiasmado, emocionadísimo","e":["He was thrilled to bits with his promotion.","I'm thrilled that the missing dog has been found."],"f":0,"t":["Estaba entusiasmadísimo con su ascenso.","Estoy emocionadísima de que hayan encontrado al perro perdido."]},{"w":"overjoyed","a":0,"es":"rebosante de alegría","e":["Her parents were overjoyed at the news.","The villagers were overjoyed when the bridge reopened."],"f":0,"t":["Sus padres rebosaban de alegría con la noticia.","Los vecinos del pueblo rebosaban de alegría cuando reabrieron el puente."]},{"w":"elated","a":1,"es":"eufórico por un logro","e":["The climbers felt elated on reaching the summit.","She was elated after winning her appeal."],"f":0,"t":["Los escaladores se sintieron eufóricos al llegar a la cima.","Estaba eufórica después de ganar su recurso."]},{"w":"ecstatic","a":1,"es":"extasiado, eufórico","e":["Fans were ecstatic when the band announced a reunion.","He was ecstatic about becoming a grandfather."],"f":0,"t":["Los fans estaban extasiados cuando el grupo anunció su regreso.","Estaba eufórico por convertirse en abuelo."]},{"w":"exhilarated","a":1,"es":"exultante, lleno de energía","e":["I felt exhilarated after cycling downhill.","The cast left the stage exhilarated."],"f":0,"t":["Me sentí exultante después de bajar la cuesta en bici.","El reparto salió del escenario lleno de energía."]},{"w":"content","a":0,"es":"satisfecho, a gusto","e":["I'm content to spend Sunday at home.","The cat seemed perfectly content in its basket."],"f":0,"t":["Me conformo con pasar el domingo en casa.","El gato parecía muy a gusto en su cesta."]},{"w":"fulfilled","a":1,"es":"realizado personalmente","e":["She feels fulfilled working with refugees.","He wanted a more fulfilled life beyond financial success."],"f":0,"t":["Se siente realizada trabajando con refugiados.","Quería una vida más plena, más allá del éxito económico."]},{"w":"sad","a":0,"es":"triste","e":["It was sad to see the shop close.","He felt sad about missing his daughter's concert."],"f":1,"t":["Fue triste ver cerrar la tienda.","Se sentía triste por perderse el concierto de su hija."]},{"w":"upset","a":0,"es":"disgustado, afectado","e":["She's upset about the cancelled appointment.","The remark left him visibly upset."],"f":1,"t":["Está disgustada por la cita cancelada.","El comentario lo dejó visiblemente afectado."]},{"w":"miserable","a":0,"es":"muy desgraciado, abatido","e":["I felt miserable throughout the wet holiday.","The thought of another lonely Christmas made her miserable."],"f":1,"t":["Me sentí fatal durante todas esas vacaciones de lluvia.","La idea de otra Navidad sola la hundía."]},{"w":"heartbroken","a":0,"es":"desconsolado","e":["They were heartbroken when their horse died.","He was heartbroken at the end of the relationship."],"f":1,"t":["Quedaron desconsolados cuando murió su caballo.","Quedó desconsolado al terminar la relación."]},{"w":"devastated","a":0,"es":"destrozado emocionalmente","e":["The family was devastated by the diagnosis.","She was devastated to lose the manuscript."],"f":1,"t":["La familia quedó destrozada por el diagnóstico.","Quedó destrozada al perder el manuscrito."]},{"w":"downcast","a":1,"es":"abatido, alicaído","e":["The defeated captain looked downcast.","Why are you so downcast this morning?"],"f":1,"t":["El capitán derrotado parecía abatido.","¿Por qué estás tan alicaído esta mañana?"]},{"w":"disconsolate","a":1,"es":"inconsolable","e":["A disconsolate child waited outside the classroom.","He remained disconsolate despite his /* ---------- búsqueda ---------- */
function esVariants(q){const v=new Set([q]);if(q.length>3){if(/as$/.test(q))v.add(q.slice(0,-2)+'os');else if(/a$/.test(q))v.add(q.slice(0,-1)+'o');if(/os$/.test(q))v.add(q.slice(0,-1));else if(/es$/.test(q))v.add(q.slice(0,-2));else if(/s$/.test(q))v.add(q.slice(0,-1));}return [...v];}
function matchES(a,q){const vs=esVariants(q);return vs.some(v=>a.nes.includes(v));}
function matchEN(a,q){return a.nw.includes(q);}
function levelOk(a){return state.level==='all'||(state.level==='c1'?a.a:!a.a);}
function search(lang,raw){const q=norm(raw);if(!q)return null;
 const direct=A.filter(a=>lang==='es'?matchES(a,q):matchEN(a,q));
 const rank=a=>lang==='es'?(a.nes.split(/[,;]\s*/).some(t=>esVariants(q).includes(t))?0:1):(a.nw===q?0:a.nw.startsWith(q)?1:2);
 direct.sort((x,y)=>rank(x)-rank(y)||x.f-y.f);
 const ids=new Set(direct.map(a=>a.id)),fams=[...new Set(direct.map(a=>a.f))];
 const groups=fams.map(f=>{const own=direct.filter(a=>a.f===f);const others=state.family?A.filter(a=>a.f===f&&!ids.has(a.id)):[];return {f,items:[...own,...others].filter(levelOk)}}).filter(g=>g.items.length);
 return {direct:direct.filter(levelOk),ids,groups};}

function hl(text,w){const i=text.toLowerCase().indexOf(w.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+w.length))+'</mark>'+esc(text.slice(i+w.length));}

 return `<article class="card${isMatch?' match':''}" id="c${a.id}"><div class="card-top"><div><h3 class="word" lang="en-GB">${esc(a.w)}</h3><span class="lvl ${a.a?'c1':''}">${a.a?'★ Avanzado C1':'Básico'}</span></div><button class="say" data-say="${a.id}" aria-label="Escuchar ${esc(a.w)}">🔊</button></div>
 <p class="es">🇪🇸 ${esc(a.es)}</p>
 ${a.e.map((e,i)=>`<div class="ex"><p><span lang="en-GB">${hl(e,a.w)}</span>${a.t?`<span class="ex-es" lang="es">${esc(a.t[i])}</span>`:''}</p><button data-sayex="${a.id}:${i}" aria-label="Escuchar ejemplo ${i+1}">🔊</button></div>`).join('')}
 <div class="card-foot"><button data-mark="${a.id}:review" class="${m==='review'?'active':''}" aria-pressed="${m==='review'}">⭐ Repasar</button><button data-mark="${a.id}:known" class="${m==='known'?'active':''}" aria-pressed="${m==='known'}">✓ Ya la sé</button><button class="fam-link" data-fam="${a.f}">${EMOJI[a.f]} ${esc(F[a.f].key)} →</button></div></article>`;}

function renderResults(lang,q){const box=$('#results');const r=search(lang,q);
 if(!r){box.innerHTML='';return;}
 if(!r.groups.length){box.innerHTML=`<div class="summary">😕 No encuentro «${esc(q)}»<small>${state.level!=='all'?'Prueba a elegir «Todos» en el nivel, o ':''}${lang==='es'?'Prueba con otra palabra en español o pasa a «Search in English».':'Try another word, or switch to «Buscar en español».'}</small></div>`;return;}
 const total=r.groups.reduce((n,g)=>n+g.items.length,0);
 box.innerHTML=`<div class="summary">✅ ${r.direct.length} ${r.direct.length===1?'adjetivo coincide':'adjetivos coinciden'}${total>r.direct.length?` · ${total-r.direct.length} sinónimos de la familia`:''}<small>Los que coinciden con «${esc(q)}» van primero y destacados. Comparten significado, pero no siempre son intercambiables.</small></div>`+
 r.groups.map(g=>`<section class="fam-block"><h3 class="fam-title">${EMOJI[g.f]} ${esc(F[g.f].key)} <span class="tag">${esc(F[g.f].title)}</span></h3><div class="cards">${g.items.map(a=>card(a,r.ids.has(a.id))).join('')}</div></section>`).join('');}
function viewFamilies(){setHome(true);
 app.innerHTML=`<div class="screen-head"><span class="emoji">🎨</span><div><div class="eyebrow">Explora por significado</div><h2>Familias</h2></div></div><div class="fam-grid">${F.map((f,i)=>`<a class="btn fam-tile" href="#/familia/${i}"><span class="e">${EMOJI[i]}</span><b>${esc(f.key)}</b><small>${esc(f.title)}</small></a>`).join('')}</div>`;}
function viewFamily(i){setHome(true);const f=F[i];if(!f)return viewFamilies();const items=A.filter(a=>a.f===i);
 app.innerHTML=`<div class="screen-head"><span class="emoji">${EMOJI[i]}</span><div><div class="eyebrow">Familia ${String(i+1).padStart(2,'0')} · ${items.length} adjetivos</div><h2>${esc(f.key)}</h2><p class="subtitle">${esc(f.title)}</p></div></div>
 <div class="chips" style="margin-bottom:14px"><a class="btn" href="#/familias">🎨 Todas las familias</a><a class="btn" href="#/practicar/${i}">✍️ Practicar esta familia</a>${i>0?`<a class="btn" href="#/familia/${i-1}">← ${esc(F[i-1].key)}</a>`:''}${i<F.length-1?`<a class="btn" href="#/familia/${i+1}">${esc(F[i+1].key)} →</a>`:''}</div>
 <div class="cards">${items.map(a=>card(a,false)).join('')}</div>`;}
function viewList(kind){setHome(true);const items=kind==='c1'?A.filter(a=>a.a):A.filter(a=>state.marks[a.id]==='review');
 app.innerHTML=`<div class="screen-head"><span class="emoji">${kind==='c1'?'🏅':'⭐'}</span><div><div class="eyebrow">${items.length} adjetivos</div><h2>${kind==='c1'?'Solo avanzados ★ C1':'Para repasar'}</h2></div></div>`+
 (items.length?(kind==='review'?`<div class="chips" style="margin-bottom:14px"><a class="btn primary" href="#/practicar/repasar">✍️ Practicar estos</a></div>`:'')+groupByFamily(items):`<div class="empty">Aún no has marcado ninguno.<br>Pulsa <b>⭐ Repasar</b> en cualquier tarjeta y aparecerá aquí.</div>`);}
function groupByFamily(items){const fams=[...new Set(items.map(a=>a.f))];return fams.map(f=>`<section class="fam-block"><h3 class="fam-title">${EMOJI[f]} ${esc(F[f].key)} <span class="tag">${esc(F[f].title)}</span></h3><div class="cards">${items.filter(a=>a.f===f).map(a=>card(a,false)).join('')}</div></section>`).join('');}
function viewAdj(id){setHome(true);const a=A[id];if(!a)return viewHome();const others=A.filter(x=>x.f===a.f&&x.id!==a.id);
 app.innerHTML=`<div class="screen-head"><span class="emoji">🎲</span><div><div class="eyebrow">Un adjetivo al azar</div><h2>Sorpréndeme</h2></div></div><div class="cards">${card(a,false)}</div>
 <div class="chips" style="margin:18px 0"><button class="primary" id="again">🎲 Otro</button></div>
 <section class="fam-block"><h3 class="fam-title">${EMOJI[a.f]} Sinónimos · ${esc(F[a.f].key)}</h3><div class="cards">${others.map(x=>card(x,false)).join('')}</div></section>`;
 $('#again').onclick=()=>{let n;do{n=Math.floor(Math.random()*A.length)}while(n===id);location.hash='#/adj/'+n;};}

/* ---------- practicar ---------- */
let P=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function viewPractice(scope){setHome(true);
 const pool=scope==='repasar'?A.filter(a=>state.marks[a.id]==='review'):scope!==undefined&&scope!==''&&!isNaN(scope)?A.filter(a=>a.f===Number(scope)):A;
 const label=scope==='repasar'?'tus adjetivos para repasar':scope!==undefined&&scope!==''&&!isNaN(scope)?'la familia '+F[Number(scope)].key:'todos los adjetivos';
 if(!pool.length){app.innerHTML=`<div class="empty">No hay adjetivos para practicar aquí todavía.</div>`;return;}
 app.innerHTML=`<div class="screen-head"><span class="emoji">✍️</span><div><div class="eyebrow">Con ${esc(label)}</div><h2>Practicar</h2></div></div>
 <div class="panel practice"><p><b>¿Cómo quieres practicar?</b></p><div class="actions"><button class="primary" data-dir="es">🇪🇸 → 🇬🇧<br><small>Veo el español, digo el inglés</small></button><button data-dir="en">🇬🇧 → 🇪🇸<br><small>Veo el inglés, digo el significado</small></button></div>
 <div class="pills" style="justify-content:center">${[10,20].map(n=>`<button data-n="${n}" class="${n===10?'active':''}">${n} tarjetas</button>`).join('')}</div></div>`;
 let n=10;app.querySelector('.pills').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;n=Number(b.dataset.n);app.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('active',x===b));};
 app.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{P={dir:b.dataset.dir,q:shuffle(pool).slice(0,n),i:0,ok:0};renderPractice();});}
function renderPractice(){const box=app;const {q,i,dir}=P;
 if(i>=q.length){box.innerHTML=`<div class="panel practice"><div class="q">🎉 ¡Sesión terminada!</div><p>Has repasado ${q.length} tarjetas y te sabías ${P.ok}.</p><div class="actions"><button class="primary" id="more">✍️ Otra ronda</button><a class="btn" href="#/">← Inicio</a></div></div>`;$('#more').onclick=()=>{P.q=shuffle(P.q);P.i=0;P.ok=0;renderPractice();};return;}
 const a=q[i];
 box.innerHTML=`<div class="panel practice"><progress max="${q.length}" value="${i}"></progress><p class="note">Tarjeta ${i+1} de ${q.length} · ${EMOJI[a.f]} ${esc(F[a.f].key)}</p>
 <div class="q" ${dir==='en'?'lang="en-GB"':''}>${dir==='es'?'🇪🇸 '+esc(a.es):esc(a.w)}</div>${dir==='en'?`<button class="say" data-say="${a.id}" style="margin:6px auto">🔊</button>`:''}
 <p class="note">${dir==='es'?'Piensa el adjetivo en inglés y pulsa «Ver respuesta».':'Piensa qué significa y pulsa «Ver respuesta».'}</p>
 <div class="actions" id="revealBox"><button class="primary" id="reveal">👀 Ver respuesta</button></div><div class="answer" id="ans" hidden>${card(a,false)}<div class="actions"><button id="know">✓ Me la sabía</button><button id="dont">⭐ Repasar</button></div></div></div>`;
 $('#reveal').onclick=()=>{$('#revealBox').hidden=true;$('#ans').hidden=false;if(dir==='es')speak(a.w);};
 $('#know').onclick=()=>{P.ok++;state.marks[a.id]='known';save();P.i++;renderPractice();window.scrollTo(0,0);};
 $('#dont').onclick=()=>{state.marks[a.id]='review';save();P.i++;renderPractice();window.scrollTo(0,0);};}

/* ---------- router ---------- */
function route(){const parts=location.hash.replace(/^#\/?/,'').split('/');const [r,arg]=[parts[0],parts.slice(1).join('/')];
 window.scrollTo(0,0);
 if(r==='es'||r==='en')return viewSearch(r,decodeURIComponent(arg||''));
 if(r==='familias')return viewFamilies();
 if(r==='familia')return viewFamily(Number(arg));
 if(r==='practicar')return viewPractice(arg);
 if(r==='repasar')return viewList('review');
 if(r==='c1')return viewList('c1');
 if(r==='adj')return viewAdj(Number(arg));
 viewHome();}
window.addEventListener('hashchange',route);
$('#homeBtn').onclick=()=>{location.hash='#/';};

/* ---------- clics comunes en tarjetas ---------- */
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.say!==undefined){speak(A[Number(b.dataset.say)].w);return;}
 if(b.dataset.sayex){const [id,i]=b.dataset.sayex.split(':').map(Number);speak(A[id].e[i]);return;}
 if(b.dataset.fam!==undefined){location.hash='#/familia/'+b.dataset.fam;return;}
 if(b.dataset.mark){const [id,v]=b.dataset.mark.split(':');if(state.marks[id]===v)delete state.marks[id];else state.marks[id]=v;save();
  const foot=b.parentElement;foot.querySelectorAll('[data-mark]').forEach(x=>{const on=state.marks[id]===x.dataset.mark.split(':')[1];x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on));});
  toast(state.marks[id]==='review'?'⭐ Añadido a «Para repasar»':state.marks[id]==='known'?'✓ ¡Bien! Marcado como aprendido':'Marca quitada');}
});

/* ---------- voz ---------- */
let voices=[];
function region(v){const l=v.lang.replace('_','-').toLowerCase();return l.startsWith('en-gb')?'UK':l.startsWith('en-us')?'USA':'Otros';}
function loadVoices(){if(!('speechSynthesis'in window)){$('#voice').innerHTML='<option value="">Audio no disponible</option>';return;}
 const seen=new Set();voices=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)).filter(v=>{const k=v.voiceURI+v.name;if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>['UK','USA','Otros'].indexOf(region(a))-['UK','USA','Otros'].indexOf(region(b))||a.name.localeCompare(b.name));
 const av=voices.filter(v=>state.region==='all'||region(v)===state.region);
 $('#voice').innerHTML=av.length?av.map(v=>`<option value="${voices.indexOf(v)}">${esc(v.name)} · ${esc(v.lang)}</option>`).join(''):'<option value="">No hay voces para este acento</option>';
 let ch=av.find(v=>v.voiceURI===state.voice)||av.find(v=>/Daniel|Arthur|Oliver|Serena|Kate|George/i.test(v.name))||av[0];$('#voice').value=ch?String(voices.indexOf(ch)):'';
 $('#voiceInfo').textContent=voices.length+' voces inglesas disponibles en este navegador.';}
function speak(text){if(!('speechSynthesis'in window)){toast('Este navegador no puede leer en voz alta.');return;}
 if(!voices.length)loadVoices();const v=voices[Number($('#voice').value)];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';u.rate=Number(state.rate)||0.9;speechSynthesis.speak(u);}
function openSettings(){loadVoices();$('#settings').showModal();}
$('#closeSet').onclick=()=>$('#settings').close();
$('#theme').value=state.theme;$('#rate').value=state.rate;$('#region').value=state.region;
$('#theme').onchange=e=>{state.theme=e.target.value;applyTheme();save();};
$('#rate').onchange=e=>{state.rate=e.target.value;save();};
$('#region').onchange=e=>{state.region=e.target.value;save();loadVoices();};
$('#voice').onchange=()=>{const v=voices[Number($('#voice').value)];if(v){state.voice=v.voiceURI;save();}};
$('#testVoice').onclick=()=>speak('I am absolutely thrilled to meet you.');
if('speechSynthesis'in window){speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices();}
applyTheme();route();
</script></body></html>
